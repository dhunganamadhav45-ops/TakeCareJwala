<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Jwala Aryal 🌷</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:"Segoe UI", sans-serif;

    background:
        linear-gradient(
            135deg,
            #dfeee2 0%,
            #f9eee5 35%,
            #f4e1e8 65%,
            #dcebdd 100%
        );

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
    position:relative;
}


/* Soft background circles */

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(5px);
    opacity:.45;
}

.c1{
    width:300px;
    height:300px;
    background:#f5cdd5;
    top:-100px;
    left:-100px;
}

.c2{
    width:350px;
    height:350px;
    background:#cfe5c8;
    bottom:-140px;
    right:-100px;
}

.c3{
    width:220px;
    height:220px;
    background:#f8dfc6;
    top:40%;
    right:10%;
}


/* Main card */

.card{

    width:90%;
    max-width:650px;

    padding:50px 35px;

    text-align:center;

    background:rgba(255,255,255,.68);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.8);

    border-radius:35px;

    box-shadow:
        0 25px 70px rgba(80,70,65,.15);

    position:relative;
    z-index:5;
}


/* Flower */

.flower{
    font-size:58px;

    animation:
        float 3s ease-in-out infinite;
}

@keyframes float{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}


.small-title{

    margin-top:15px;

    font-size:12px;

    letter-spacing:4px;

    color:#9b8078;

    text-transform:uppercase;
}


h1{

    margin-top:10px;

    font-family:Georgia,serif;

    font-size:52px;

    font-weight:500;

    color:#756456;
}


.subtitle{

    margin-top:8px;

    font-family:Georgia,serif;

    color:#96796d;

    font-size:18px;
}


/* Short message */

.message{

    margin-top:30px;

    font-family:Georgia,serif;

    font-size:21px;

    line-height:1.7;

    color:#665a54;
}


.message span{

    display:block;

    margin:7px 0;
}


/* Signs */

.signs{

    margin-top:28px;

    display:flex;

    justify-content:center;

    gap:18px;

    flex-wrap:wrap;
}


.sign{

    width:75px;
    height:75px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:32px;

    background:rgba(255,255,255,.65);

    border-radius:50%;

    box-shadow:
        0 8px 20px rgba(90,70,60,.08);

    transition:.3s;
}


.sign:hover{

    transform:
        translateY(-7px)
        rotate(4deg);
}


/* Main line */

.final{

    margin-top:30px;

    font-family:Georgia,serif;

    font-size:20px;

    color:#80695e;
}


.final strong{

    font-weight:600;
}


/* Button */

button{

    margin-top:25px;

    padding:13px 28px;

    border:none;

    border-radius:50px;

    background:#9c806f;

    color:white;

    font-size:14px;

    cursor:pointer;

    transition:.3s;
}


button:hover{

    transform:translateY(-3px);

    background:#866d5e;
}


#message{

    display:none;

    margin-top:20px;

    font-family:Georgia,serif;

    color:#80695e;

    line-height:1.7;

    animation:appear .7s ease;
}


@keyframes appear{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* Floating flowers */

.floating{

    position:fixed;

    bottom:-40px;

    animation:rise linear forwards;

    opacity:0;

    pointer-events:none;

    z-index:1;
}


@keyframes rise{

    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.7;
    }

    100%{
        transform:
            translateY(-110vh)
            rotate(25deg);

        opacity:0;
    }
}


/* Mobile */

@media(max-width:600px){

    .card{
        padding:40px 20px;
    }

    h1{
        font-size:42px;
    }

    .message{
        font-size:19px;
    }

    .sign{
        width:65px;
        height:65px;
        font-size:28px;
    }

}

</style>
</head>


<body>


<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>


<div class="card">


    <div class="flower">
        🌷
    </div>


    <div class="small-title">
        A little care
    </div>


    <h1>
        Jwala Aryal
    </h1>


    <div class="subtitle">
        🌿 Just rest for now 🌿
    </div>


    <div class="message">

        <span>🌷 Rest well.</span>

        <span>💧 Stay hydrated.</span>

        <span>🌿 Take it easy.</span>

        <span>☁️ No worries.</span>

        <span>🌼 Better days soon.</span>

    </div>


    <div class="signs">

        <div class="sign">🌷</div>

        <div class="sign">🌿</div>

        <div class="sign">☁️</div>

        <div class="sign">🌼</div>

        <div class="sign">☀️</div>

        <div class="sign">🫶🏻</div>

    </div>


    <div class="final">

        <strong>
            Get well soon 🌸
        </strong>

        <br>

        <span>
            One day at a time 🌿
        </span>

    </div>


    <button onclick="showMessage()">
        🌷 A little reminder
    </button>


    <div id="message">

        Breathe 🌿<br>
        Rest ☁️<br>
        Smile when you can 🌼<br>
        Better mornings are coming ☀️

    </div>


</div>


<script>


function showMessage(){

    const msg =
        document.getElementById("message");

    if(msg.style.display === "block"){

        msg.style.display="none";

    }else{

        msg.style.display="block";

    }

}


/* Floating flowers */

function createFlower(){

    const flower =
        document.createElement("div");

    flower.className="floating";


    const flowers=[
        "🌸",
        "🌷",
        "🌼",
        "🌻",
        "🍃",
        "🌿",
        "✿",
        "❀"
    ];


    flower.innerHTML =
        flowers[
            Math.floor(
                Math.random()*flowers.length
            )
        ];


    flower.style.left =
        Math.random()*100+"vw";


    flower.style.fontSize =
        (15+Math.random()*20)+"px";


    flower.style.animationDuration =
        (7+Math.random()*6)+"s";


    document.body.appendChild(flower);


    setTimeout(()=>{

        flower.remove();

    },14000);

}


setInterval(createFlower,800);


</script>

</body>
</html>
